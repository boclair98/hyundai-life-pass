spring:
  application:
    name: hyundai-life-pass-api
  datasource:
    url: jdbc:h2:mem:lifepass;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  session:
    store-type: jdbc
    timeout: 30d
    jdbc:
      initialize-schema: never
  h2:
    console:
      enabled: true
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: LIFE_PASS_SESSION
        http-only: true
        secure: ${LIFEPASS_SESSION_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

lifepass:
  sample-data-enabled: ${LIFEPASS_SAMPLE_DATA_ENABLED:true}
  rate-limit-per-minute: ${LIFEPASS_RATE_LIMIT_PER_MINUTE:240}
  cors-origins: "https://hyundai-life-pass.coders.kr,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:5176,http://127.0.0.1:4173"
  release-tick-ms: 20000
  operator-users: ""
  operator-token: ${LIFEPASS_OPERATOR_TOKEN:}
  allow-demo-operator: true
  trusted-user-header-enabled: ${LIFEPASS_TRUSTED_USER_HEADER_ENABLED:false}
  providers:
    hyundai:
      mode: ${LIFEPASS_HYUNDAI_MODE:simulation}
      client-id: ${HYUNDAI_CLIENT_ID:}
      client-secret: ${HYUNDAI_CLIENT_SECRET:}
      redirect-uri: ${HYUNDAI_REDIRECT_URI:}
      authorize-url: ${HYUNDAI_AUTHORIZE_URL:https://prd.kr-ccapi.hyundai.com/api/v1/user/oauth2/authorize}
      token-url: ${HYUNDAI_TOKEN_URL:https://prd.kr-ccapi.hyundai.com/api/v1/user/oauth2/token}
      profile-url: ${HYUNDAI_PROFILE_URL:https://prd.kr-ccapi.hyundai.com/api/v1/user/profile}
      data-api-base-url: ${HYUNDAI_DATA_API_BASE_URL:https://dev.kr-ccapi.hyundai.com}
      agreement-url: ${HYUNDAI_AGREEMENT_URL:https://dev.kr-ccapi.hyundai.com/api/v1/car-service/terms/agreement}
      reject-url: ${HYUNDAI_REJECT_URL:https://dev.kr-ccapi.hyundai.com/api/v1/car-service/terms/reject}
      callback-secret: ${HYUNDAI_CALLBACK_SECRET:}
      token-encryption-key: ${HYUNDAI_TOKEN_ENCRYPTION_KEY:}
    ev-charger:
      mode: ${LIFEPASS_EV_CHARGER_MODE:simulation}
      service-key: ${DATA_GO_KR_SERVICE_KEY:}
      base-url: ${DATA_GO_KR_EV_CHARGER_URL:https://apis.data.go.kr/B552584/EvCharger/getChargerInfo}
      zcode: ${LIFEPASS_EV_CHARGER_ZCODE:11}
      center-latitude: ${LIFEPASS_CENTER_LATITUDE:37.5446}
      center-longitude: ${LIFEPASS_CENTER_LONGITUDE:127.0559}
      default-price-per-kwh: ${LIFEPASS_DEFAULT_CHARGE_PRICE:347}
      cache-seconds: ${LIFEPASS_EV_CHARGER_CACHE_SECONDS:300}
    kakao-local:
      mode: ${LIFEPASS_KAKAO_LOCAL_MODE:live}
      rest-api-key: ${KAKAO_REST_API_KEY:}
      base-url: ${KAKAO_LOCAL_API_URL:https://dapi.kakao.com/v2/local/search/keyword.json}
      region-url: ${KAKAO_REGION_API_URL:https://dapi.kakao.com/v2/local/geo/coord2regioncode.json}
      cache-seconds: ${LIFEPASS_KAKAO_LOCAL_CACHE_SECONDS:300}
