version: "1"
# This app owns the Hyundai OAuth flow. Native mode would put the coders.kr
# visitor gate in front of every POST and break consumer actions.
mode: standalone

services:
  web:
    dockerfile: Dockerfile
    context: .
    port: 80
    expose: public
    env:
      BACKEND_URL: ${api.internal_url}

  api:
    dockerfile: backend/Dockerfile
    context: backend
    port: 8080
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${db.host}:${db.port}/${db.name}
      SPRING_DATASOURCE_USERNAME: ${db.user}
      SPRING_DATASOURCE_PASSWORD: ${db.password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      LIFEPASS_ALLOW_DEMO_OPERATOR: "false"
      LIFEPASS_SAMPLE_DATA_ENABLED: "false"
      LIFEPASS_EV_CHARGER_MODE: live
      LIFEPASS_HYUNDAI_MODE: live
      LIFEPASS_KAKAO_LOCAL_MODE: live
      LIFEPASS_RATE_LIMIT_PER_MINUTE: "240"
      LIFEPASS_SESSION_COOKIE_SECURE: "true"

  db:
    type: postgres
    size: 1Gi
