version: "1"
mode: native

services:
  web:
    dockerfile: Dockerfile
    context: .
    port: 80
    expose: public
    env:
      BACKEND_URL: ${api.internal_url}

  api:
    dockerfile: backend/Dockerfile
    context: backend
    port: 8080
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${db.host}:${db.port}/${db.name}
      SPRING_DATASOURCE_USERNAME: ${db.user}
      SPRING_DATASOURCE_PASSWORD: ${db.password}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      LIFEPASS_OPERATOR_USERS: boclair98@users.noreply.github.com
      LIFEPASS_ALLOW_DEMO_OPERATOR: "false"

  db:
    type: postgres
    size: 1Gi
